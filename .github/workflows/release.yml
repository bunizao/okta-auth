name: Release

# One workflow for both packages: PyPI and npm trusted publishing are bound to
# this file name. Tag py-vX.Y.Z releases python/, ts-vX.Y.Z releases typescript/.
on:
  push:
    tags:
      - "py-v*"
      - "ts-v*"

permissions:
  contents: read

jobs:
  python-build:
    if: startsWith(github.ref_name, 'py-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "py-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != py-v$version"; exit 1; }

      - name: Build artifacts
        run: |
          python -m pip install -U pip build twine
          python -m build
          twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: python/dist/

  python-publish:
    needs: python-build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  typescript-publish:
    if: startsWith(github.ref_name, 'ts-v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Check the tag matches the package version
        run: |
          version=$(node -p 'require("./package.json").version')
          test "ts-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != ts-v$version"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Check, test and build
        run: npm run check && npm test && npm run build

      # A pre-release (1.2.3-rc.0) goes to the "next" dist-tag so `npm install`
      # keeps getting the last stable version.
      - name: Publish to npm
        run: |
          version=$(node -p 'require("./package.json").version')
          case "$version" in
            *-*) npm publish --provenance --access public --tag next ;;
            *) npm publish --provenance --access public ;;
          esac
